  <!DOCTYPE html>
  <html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dealett – Logga in</title>

    <!-- Frameworks & Global Styles -->
    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
          crossorigin="anonymous" />

    <link rel="stylesheet" href="./assets/style.css">
    <link rel="stylesheet" href="./assets/index.css">
    <script src="./assets/layout.js" defer></script>

  </head>

  <body class="home-page min-h-screen font-[Inter] text-gray-900" data-header-mode="overlay">

    <!-- Header -->
    <div id="header-placeholder"></div>

    <!-- LOGIN SECTION -->
    <section class="min-h-[80vh] flex items-center justify-center px-6 py-20">
      <div class="w-full max-w-md relative overflow-hidden" style="background:rgba(255,255,255,0.88);border:1px solid rgba(255,255,255,0.85);border-radius:32px;padding:2.5rem;backdrop-filter:blur(20px);box-shadow:0 30px 80px rgba(15,23,42,0.12);">

        <div class="mb-6 text-center">
          <span class="section-kicker">Välkommen tillbaka</span>
        </div>

        <h1 style="margin:16px 0 24px;font-size:2.2rem;font-weight:900;letter-spacing:-0.04em;color:#0f172a;text-align:center;line-height:1.05;">
          Logga in
        </h1>

        <form id="loginForm" class="space-y-5 relative z-10">
          <div>
            <label class="block text-sm font-semibold mb-2" style="color:#0f172a;">E-post</label>
            <input
              id="loginEmail"
              type="email"
              required
              style="width:100%;padding:14px 18px;border-radius:16px;border:1px solid rgba(15,23,42,0.12);background:#fff;font-family:inherit;font-size:1rem;color:#0f172a;outline:none;transition:border-color .2s,box-shadow .2s;"
              placeholder="namn@email.se"
              onfocus="this.style.borderColor='rgba(15,118,110,0.45)';this.style.boxShadow='0 0 0 4px rgba(15,118,110,0.10)'"
              onblur="this.style.borderColor='rgba(15,23,42,0.12)';this.style.boxShadow='none'"
            />
          </div>

          <div>
            <label class="block text-sm font-semibold mb-2" style="color:#0f172a;">Lösenord</label>
            <input
              id="loginPassword"
              type="password"
              required
              style="width:100%;padding:14px 18px;border-radius:16px;border:1px solid rgba(15,23,42,0.12);background:#fff;font-family:inherit;font-size:1rem;color:#0f172a;outline:none;transition:border-color .2s,box-shadow .2s;"
              placeholder="••••••••"
              onfocus="this.style.borderColor='rgba(15,118,110,0.45)';this.style.boxShadow='0 0 0 4px rgba(15,118,110,0.10)'"
              onblur="this.style.borderColor='rgba(15,23,42,0.12)';this.style.boxShadow='none'"
            />
          </div>

          <button
            type="submit"
            class="btn-primary"
            style="width:100%;border:none;cursor:pointer;font-family:inherit;">
            Logga in
          </button>
        </form>

        <div class="mt-6 text-center text-sm relative z-10" style="color:#64748b;">
          Har du inget konto?
          <a href="#" style="color:#0f766e;font-weight:700;text-decoration:none;" onmouseover="this.style.textDecoration='underline'" onmouseout="this.style.textDecoration='none'">
            Registrera dig
          </a>
        </div>
      </div>
    </section>

    <div id="footer-placeholder"></div>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        document.getElementById("loginForm").addEventListener("submit", function(e) {
          e.preventDefault();

          const email = document.getElementById("loginEmail").value;
          const password = document.getElementById("loginPassword").value;

          if (email && password) {
            localStorage.setItem("dealett_user", JSON.stringify({
              name: email.split("@")[0],
              email: email
            }));

            window.location.href = "account.html";
          }
        });
      });
    </script>
  </body>
  </html>
