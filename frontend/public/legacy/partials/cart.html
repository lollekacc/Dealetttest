<!-- DRAWER -->
<div id="cartDrawer" class="fixed inset-0 z-[9999] hidden">

  <!-- OVERLAY -->
  <div id="cartOverlay" class="absolute inset-0 bg-black/40"></div>

  <!-- PANEL -->
  <div class="absolute right-0 top-0 h-full w-[420px] bg-white shadow-2xl flex flex-col">

    <!-- HEADER -->
    <div class="flex items-center justify-between px-6 py-5 border-b">
      <h2 class="text-xl font-bold">Din varukorg</h2>
      <button id="closeCart" class="text-gray-500 hover:text-black text-lg">✕</button>
    </div>

    <!-- BODY -->
    <div id="cartItems"
         class="flex-1 overflow-y-auto px-6 py-6 space-y-4">
    </div>

    <!-- FOOTER -->
    <div class="border-t p-6">

      <div id="summaryArea" class="space-y-3 text-sm mb-4"></div>

      <div class="flex justify-between items-center mb-4">
        <span class="text-gray-600">Totalt</span>
        <span id="totalPrice" class="text-xl font-bold text-[#0C4A3C]">0 kr</span>
      </div>

      <button id="checkoutBtn"
        class="w-full adeala-btn py-4 rounded-xl font-bold">
        Checkout
      </button>

    </div>

  </div>

</div>
<script>
  const CART_KEY = "dealettCart";

function getCart() {
  return JSON.parse(localStorage.getItem(CART_KEY)) || [];
}

function saveCart(cart) {
  localStorage.setItem(CART_KEY, JSON.stringify(cart));
}

function addToCart(item) {
  const cart = getCart();
  cart.push(item);
  saveCart(cart);

  window.dispatchEvent(new Event("cartUpdated"));
}

function removeFromCart(index) {
  const cart = getCart();
  cart.splice(index, 1);
  saveCart(cart);

  window.dispatchEvent(new Event("cartUpdated"));
}

function clearCart() {
  localStorage.removeItem(CART_KEY);
  window.dispatchEvent(new Event("cartUpdated"));
}

// expose globally
window.cartAPI = {
  getCart,
  addToCart,
  removeFromCart,
  clearCart
};
function renderCart() {
  const container = document.getElementById("cartItems");
  const totalEl = document.getElementById("totalPrice");
  const summary = document.getElementById("summaryArea");

  if (!container || !totalEl) return;

  const cart = getCart();
  container.innerHTML = "";

  let total = 0;

  cart.forEach((item, index) => {
    total += item.price || 0;

    const rewardsHTML = Object.entries(item.rewards || {})
      .filter(([_, v]) => v > 0)
      .map(([k, v]) => `<div class="text-xs text-gray-500">${k}: ${v} kr</div>`)
      .join("");

    const el = document.createElement("div");
    el.className = "border rounded-xl p-4 flex gap-3";

    el.innerHTML = `
      <img src="${item.logo}" class="w-12 h-12 object-contain rounded-md border">

      <div class="flex-1">
        <div class="flex justify-between items-start">
          <div>
            <p class="font-semibold">${item.title}</p>
            <p class="text-sm text-gray-500">${item.operator}</p>
          </div>

          <button data-index="${index}" class="removeItem text-red-500 text-sm">Ta bort</button>
        </div>

        <div class="mt-2 text-sm">
          <strong>${item.price} kr/mån</strong>
        </div>

        <div class="mt-2">
          ${rewardsHTML || "<span class='text-xs text-gray-400'>Ingen belöning</span>"}
        </div>
      </div>
    `;

    container.appendChild(el);
  });

  totalEl.textContent = total + " kr";

  summary.innerHTML = `
    <div>Antal abonnemang: ${cart.length}</div>
  `;

  // remove handlers
  document.querySelectorAll(".removeItem").forEach(btn => {
    btn.addEventListener("click", () => {
      removeFromCart(Number(btn.dataset.index));
    });
  });
}

// INIT + LISTENER
document.addEventListener("DOMContentLoaded", renderCart);
window.addEventListener("cartUpdated", renderCart);
document.addEventListener("DOMContentLoaded", () => {
  const drawer = document.getElementById("cartDrawer");
  const overlay = document.getElementById("cartOverlay");
  const closeBtn = document.getElementById("closeCart");

  if (!drawer) return;

  window.openCart = () => {
    drawer.classList.remove("hidden");
  };

  function closeCart() {
    drawer.classList.add("hidden");
  }

  overlay?.addEventListener("click", closeCart);
  closeBtn?.addEventListener("click", closeCart);
});
</script>
