<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dealett – Välj belöning</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/style.css">
  <link rel="stylesheet" href="./assets/design.css">
</head>

<body class="font-[Inter] min-h-screen bg-[#f5f8fb] text-slate-900">

<main class="max-w-6xl mx-auto px-6 py-10">

  <h1 class="text-3xl font-bold text-center mb-8">
    Välj din belöning
  </h1>

  <div id="rewardGrid" class="grid grid-cols-2 md:grid-cols-3 gap-6"></div>

  <div class="mt-10 text-center">
    <button id="continueBtn" disabled class="px-8 py-4 bg-[#0C4A3C] text-white rounded-xl opacity-50">
      Fortsätt
    </button>
  </div>

</main>

<script>
const rewards = [
  { name: "ICA Maxi", logo: "https://detailproduktion.se/wp-content/uploads/2014/04/ica-maxi-stormarknad-logo.png"},
  { name: "Amazon", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/a9/Amazon_logo.svg/1280px-Amazon_logo.svg.png"},
  { name: "MIO", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/6e/MIO_Logo.svg/2560px-MIO_Logo.svg.png"},
  { name: "Coop", logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/d/d4/Coop_logo.svg/2560px-Coop_logo.svg.png"},
  { name: "H&M", logo: "https://upload.wikimedia.org/wikipedia/commons/5/53/H%26M-Logo.svg"}
];

const stored = JSON.parse(localStorage.getItem("rewardChoice"));
const TOTAL = stored?.reward || 1000;

const grid = document.getElementById("rewardGrid");
const btn = document.getElementById("continueBtn");

let selected = null;

rewards.forEach(r => {
  const card = document.createElement("button");
  card.className = "p-6 bg-white rounded-xl shadow flex flex-col items-center gap-3";

  card.innerHTML = `
    <img src="${r.logo}" class="h-10 object-contain">
    <strong>${r.name}</strong>
    <span>${TOTAL} kr</span>
  `;

  card.onclick = () => {
    document.querySelectorAll("#rewardGrid button")
      .forEach(x => x.classList.remove("ring-2","ring-green-500"));

    card.classList.add("ring-2","ring-green-500");

    selected = {
      company: r.name,
      value: TOTAL
    };

    btn.disabled = false;
    btn.classList.remove("opacity-50");
  };

  grid.appendChild(card);
});

btn.onclick = () => {
  if (!selected) return;

  localStorage.setItem("rewardDistribution", JSON.stringify({
    [selected.company]: selected.value
  }));

  // 🔥 notify parent (your abonnemang page)
  window.parent.postMessage("rewardDone", "*");
};
</script>

</body>
</html>
