<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Dealett – Bredband</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="./assets/bredband.css">

</head>

<body class="font-[Inter] bg-slate-50 text-gray-900">

<div id="header-placeholder"></div>


<!-- HERO -->

<section class="hero">

<img src="https://images.unsplash.com/photo-1555617117-08fda8eab7e6?q=80&w=2070&auto=format&fit=crop" class="hero-bg">

<div class="hero-overlay"></div>

<div class="hero-content">

<h1>Hitta rätt bredband</h1>

<p>Se vilka operatörer som kan leverera till din adress</p>

<div class="hero-search">

<input id="addressInput"
placeholder="Ex: Storgatan 3, Stockholm">

<button id="searchBtn">
Sök bredband
</button>

</div>

</div>

</section>



<!-- RESULTS -->

<section class="results-section">

<div class="results-container">

<div id="resultsHeader" class="results-header hidden">

<h2>Tillgängliga bredband</h2>

<p id="resultsCount"></p>

</div>

<div id="offers" class="offers-grid"></div>

</div>

</section>



<!-- STICKY CONTINUE -->

<div id="stickyContinue" class="sticky-continue hidden">

<div class="continue-inner">

<p id="selectedPlanText">
Inget bredband valt
</p>

<button id="continueBtn">
Fortsätt
</button>

</div>

</div>



<!-- CHANNEL MODAL -->

<div id="channelsModal" class="modal hidden">

<div class="modal-card">

<button id="closeChannelsModal">✕</button>

<h3 id="channelsTitle">Kanaler</h3>

<div id="channelsGrid" class="channels-grid"></div>

</div>

</div>



<div id="footer-placeholder"></div>



<script>

let bredbandPlans = []
let selectedPlan = null



const operatorLogos = {

Telia:"images/telia.png",
Tele2:"images/tele2.jpg",
Tre:"images/tre.jpg",
Telenor:"images/telenor.jpg"

}



function calculateReward(price){

if(price<299) return 1000
if(price<399) return 2000
if(price<499) return 3000
if(price<699) return 4000
return 5000

}



fetch("./data/5Gbredband.json")
.then(r=>r.json())
.then(data=>{

bredbandPlans=data

})



document.getElementById("searchBtn").onclick=()=>{

const address=document.getElementById("addressInput").value.trim()

if(!address) return

renderOffers()

}



function renderOffers(){

const container=document.getElementById("offers")

const header=document.getElementById("resultsHeader")

container.innerHTML=""

const fiber=bredbandPlans.filter(p=>p.technology==="fiber")

const offers=fiber.length?fiber:bredbandPlans



offers
.sort((a,b)=>a.speedMbps-b.speedMbps || a.price-b.price)
.forEach(plan=>{

const card=document.createElement("div")

card.className="offer-card"

card.innerHTML=`

<div class="offer-top">

<img src="${operatorLogos[plan.operator]}" class="operator-logo">

<span class="speed">${plan.speed}</span>

</div>

<div class="price">

${plan.price} kr/mån

</div>

<div class="features">

${plan.features?plan.features.map(f=>`<div>${f}</div>`).join(""):""}

</div>

<div class="offer-actions">

<button class="reward-btn">
${calculateReward(plan.price)} kr
</button>

${plan.tv?`<button class="channels-btn" data-id="${plan.id}">
Kanaler
</button>`:""}

</div>

`

card.onclick=()=>selectPlan(plan,card)

container.appendChild(card)

})



header.classList.remove("hidden")

document.getElementById("resultsCount").textContent=

`${offers.length} bredband hittades`

}



function selectPlan(plan,card){

document.querySelectorAll(".offer-card")
.forEach(c=>c.classList.remove("active"))

card.classList.add("active")

selectedPlan=plan

document.getElementById("stickyContinue")
.classList.remove("hidden")

document.getElementById("selectedPlanText")
.textContent=`Valt: ${plan.operator} ${plan.speed}`

}



document.getElementById("continueBtn").onclick=()=>{

if(!selectedPlan) return

sessionStorage.setItem("selectedBredbandId",selectedPlan.id)

window.location.href="signera.html"

}



</script>



<script>

document.addEventListener("DOMContentLoaded", async()=>{

document.getElementById("header-placeholder").innerHTML=
await fetch("partials/header.html").then(r=>r.text())

document.getElementById("footer-placeholder").innerHTML=
await fetch("partials/footer.html").then(r=>r.text())

})

</script>

</body>
</html>
