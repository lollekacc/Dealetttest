<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dealett – Abonnemang</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="./assets/style.css">
  <link rel="stylesheet" href="./assets/abonnemang.css">
  <script src="./assets/layout.js" defer></script>
</head>

<body class="abon-page" data-header-mode="solid" data-header-theme="dark">
  <div id="header-placeholder"></div>

  <main class="abon-main">
    <section class="hero-shell shop-hero" data-header-anchor-target>
      <img
        src="images/hero-device.jpg"
        alt="Streamingtjänster och mobilabonnemang"
        class="shop-hero-image"
        fetchpriority="high"
        decoding="async"
      />

      <div class="shop-hero-content">
        <nav class="shop-breadcrumb" aria-label="Brödsmulor">
        </nav>

        <h1>Mobilabonnemang</h1>

        <ul class="shop-hero-points" aria-label="Fördelar">
          <li><i class="fa-solid fa-check"></i> Fria samtal och sms</li>
          <li><i class="fa-solid fa-check"></i> 5G hos utvalda operatörer</li>
          <li><i class="fa-solid fa-check"></i> Presentkort på abonnemang</li>
        </ul>
      </div>
    </section>

    <section id="offersSection" class="result-section">
      <div class="result-shell">
        <div class="section-head shop-list-head reveal">
          <h2>Välj surfmängd och operatör</h2>
        </div>

        <div id="offersStrip" class="offers-strip reveal">
          <div class="offers-strip-top">
            <div class="offers-strip-badge">
              <i class="fa-solid fa-sim-card"></i>
              Alla abonnemang
            </div>
          </div>

          <div id="offersTrack" class="offers-track">
            <div class="offers-inner">
              <div id="offers-container" class="offers-container"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section id="rewardSection" class="result-section is-hidden">
      <div class="result-shell result-narrow">
        <div class="section-head center reveal">
          <span class="section-kicker">Belöningar</span>
          <h2>Välj presentkort</h2>
          <p>Fördela hela värdet tydligt innan du går vidare.</p>
        </div>

        <div class="pro-card reward-panel reveal">
          <div class="reward-summary-bar">
            <div>
              <span>Totalt belöningsvärde</span>
              <strong><span id="totalReward">0</span> kr</strong>
            </div>

            <div class="reward-progress">
              <div id="rewardProgressFill" class="reward-progress-fill"></div>
            </div>

            <div class="reward-summary-right">
              <span>Återstår</span>
              <strong id="remainingSumWrap"><span id="remainingSum">0</span> kr</strong>
            </div>
          </div>

          <div id="rewardGrid" class="reward-grid-native"></div>

          <button id="rewardContinueBtn" class="primary-btn full-btn" disabled>
            Lägg till i varukorg
          </button>
        </div>
      </div>
    </section>
  </main>

  <div id="footer-placeholder"></div>

  <script type="module" src="./assets/offers.js"></script>

  <div id="cartDrawer" class="cart-drawer fixed inset-0 z-[9999] hidden">
    <div id="cartOverlay" class="cart-drawer-overlay absolute inset-0 bg-black/45 backdrop-blur-[2px]"></div>

    <div class="cart-drawer-panel absolute right-0 top-0 h-full w-full max-w-[440px] bg-white shadow-2xl flex flex-col">
      <div class="cart-drawer-head flex items-center justify-between px-6 py-5 border-b border-slate-200">
        <h2 class="text-xl font-bold tracking-tight">Din varukorg</h2>
        <button id="closeCart" class="cart-drawer-close text-slate-500 text-lg hover:text-slate-900 transition" aria-label="Stäng varukorg">×</button>
      </div>

      <div id="cartItems" class="cart-drawer-items flex-1 overflow-y-auto px-6 py-6 space-y-4"></div>

      <div class="cart-drawer-footer border-t border-slate-200 p-6 bg-slate-50">
        <div id="summaryArea" class="cart-drawer-summary space-y-3 text-sm mb-4"></div>

        <div class="flex justify-between items-center mb-4">
          <span class="text-slate-600">Totalt</span>
          <span id="totalPrice" class="text-2xl font-extrabold tracking-tight">0 kr</span>
        </div>

        <button id="goToCartPageBtn" class="w-full adeala-btn py-4 rounded-2xl font-bold">
          Fortsätt till varukorg
        </button>
      </div>
    </div>
  </div>

  <script src="./assets/cart.js"></script>
</body>
</html>
