<div id="dealett-chat" data-chat-root>

  <button id="chat-toggle">
    <span>Dealett-AI</span>
  </button>

  <div id="chat-panel" class="chat-panel closed">

    <div class="chat-header">
      <div class="chat-header-left">
        <strong>Dealett-AI</strong>
      </div>

      <div class="chat-header-right">
        <button id="chat-reset" class="chat-reset-btn-header" type="button">
          Starta fräscht
        </button>
        <button id="chat-close" aria-label="Stäng chatt">✕</button>
      </div>
    </div>

    <div id="chat-messages"></div>

    <form id="chat-form">
      <input
        id="chat-input"
        type="text"
        placeholder="Skriv vad du behöver hjälp med här..."
        autocomplete="off"
      />
      <button type="submit">Skicka</button>
    </form>

  </div>
</div>
