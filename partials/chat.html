# Dealett Chat UI Refresh

Replace your current markup with the slightly improved version below, then add the CSS underneath.

```html
<div id="dealett-chat" data-chat-root>
  <button id="chat-toggle">
    <span class="chat-toggle-dot"></span>
    <span>Dealett-AI</span>
  </button>

  <div id="chat-panel" class="chat-panel closed">

    <div class="chat-header">
      <div class="chat-header-left">
        <div class="chat-avatar">D</div>
        <div>
          <strong>Dealett-AI</strong>
          <div class="chat-subtitle">Hjälper dig hitta rätt abonnemang</div>
        </div>
      </div>

      <div class="chat-header-right">
        <button id="chat-reset" class="chat-reset-btn-header" type="button">
          Starta fräscht
        </button>
        <button id="chat-close" aria-label="Stäng chatt">✕</button>
      </div>
    </div>

    <div id="chat-messages"></div>

    <form id="chat-form">
      <input
        id="chat-input"
        type="text"
        placeholder="Skriv vad du behöver hjälp med här..."
        autocomplete="off"
      />
      <button type="submit">Skicka</button>
    </form>
  </div>
</div> 
<style>
css
#dealett-chat {
  position: fixed;
  right: 24px;
  bottom: 24px;
  z-index: 9999;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

#chat-toggle {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  border: none;
  border-radius: 999px;
  background: linear-gradient(135deg, #1e293b 0%, #111827 100%);
  color: #fff;
  padding: 14px 20px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  box-shadow:
    0 10px 30px rgba(15, 23, 42, 0.28),
    0 2px 8px rgba(15, 23, 42, 0.18);
  transition: transform 0.18s ease, box-shadow 0.18s ease;
}

#chat-toggle:hover {
  transform: translateY(-2px);
  box-shadow:
    0 14px 36px rgba(15, 23, 42, 0.34),
    0 4px 12px rgba(15, 23, 42, 0.2);
}

.chat-toggle-dot {
  width: 10px;
  height: 10px;
  border-radius: 50%;
  background: #22c55e;
  box-shadow: 0 0 0 6px rgba(34, 197, 94, 0.18);
}

.chat-panel {
  position: absolute;
  right: 0;
  bottom: 72px;
  width: 390px;
  height: 640px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  border-radius: 24px;
  background: #ffffff;
  border: 1px solid rgba(226, 232, 240, 0.9);
  box-shadow:
    0 28px 60px rgba(15, 23, 42, 0.18),
    0 8px 20px rgba(15, 23, 42, 0.08);
  transform-origin: bottom right;
  transition:
    opacity 0.2s ease,
    transform 0.2s ease;
}

.chat-panel.closed {
  opacity: 0;
  transform: translateY(12px) scale(0.97);
  pointer-events: none;
}

.chat-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 20px;
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
  color: #fff;
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

.chat-header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

.chat-avatar {
  width: 42px;
  height: 42px;
  border-radius: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(255,255,255,0.12);
  color: #fff;
  font-weight: 700;
  font-size: 16px;
  border: 1px solid rgba(255,255,255,0.12);
}

.chat-header-left strong {
  display: block;
  font-size: 15px;
  letter-spacing: 0.01em;
}

.chat-subtitle {
  margin-top: 2px;
  font-size: 12px;
  color: rgba(255,255,255,0.72);
}

.chat-header-right {
  display: flex;
  align-items: center;
  gap: 8px;
}

.chat-reset-btn-header,
#chat-close {
  border: none;
  cursor: pointer;
  transition: background 0.18s ease, color 0.18s ease;
}

.chat-reset-btn-header {
  padding: 9px 12px;
  border-radius: 10px;
  background: rgba(255,255,255,0.1);
  color: rgba(255,255,255,0.92);
  font-size: 12px;
  font-weight: 600;
}

.chat-reset-btn-header:hover {
  background: rgba(255,255,255,0.16);
}

#chat-close {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  background: rgba(255,255,255,0.08);
  color: #fff;
  font-size: 16px;
}

#chat-close:hover {
  background: rgba(255,255,255,0.16);
}

#chat-messages {
  flex: 1;
  padding: 20px;
  background:
    radial-gradient(circle at top right, rgba(59,130,246,0.05), transparent 30%),
    #f8fafc;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

#chat-messages::-webkit-scrollbar {
  width: 8px;
}

#chat-messages::-webkit-scrollbar-thumb {
  background: #cbd5e1;
  border-radius: 999px;
}

.chat-message {
  max-width: 82%;
  padding: 14px 16px;
  border-radius: 18px;
  line-height: 1.5;
  font-size: 14px;
  word-break: break-word;
}

.chat-message.user {
  align-self: flex-end;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #fff;
  border-bottom-right-radius: 6px;
  box-shadow: 0 10px 24px rgba(37, 99, 235, 0.22);
}

.chat-message.bot {
  align-self: flex-start;
  background: #fff;
  color: #0f172a;
  border: 1px solid #e2e8f0;
  border-bottom-left-radius: 6px;
  box-shadow: 0 8px 22px rgba(15, 23, 42, 0.06);
}

#chat-form {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 16px;
  background: #fff;
  border-top: 1px solid #e2e8f0;
}

#chat-input {
  flex: 1;
  height: 52px;
  border: 1px solid #dbe3ee;
  border-radius: 16px;
  padding: 0 16px;
  font-size: 14px;
  background: #f8fafc;
  color: #0f172a;
  transition: border-color 0.18s ease, box-shadow 0.18s ease;
}

#chat-input:focus {
  outline: none;
  border-color: #2563eb;
  box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
  background: #fff;
}

#chat-form button[type="submit"] {
  height: 52px;
  padding: 0 18px;
  border: none;
  border-radius: 16px;
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #fff;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 10px 22px rgba(37, 99, 235, 0.22);
  transition: transform 0.18s ease, box-shadow 0.18s ease;
}

#chat-form button[type="submit"]:hover {
  transform: translateY(-1px);
  box-shadow: 0 14px 28px rgba(37, 99, 235, 0.28);
}

@media (max-width: 520px) {
  #dealett-chat {
    right: 0;
    bottom: 0;
    left: 0;
  }

  .chat-panel {
    width: 100vw;
    height: 100vh;
    right: 0;
    bottom: 0;
    border-radius: 0;
  }

  #chat-toggle {
    position: fixed;
    right: 16px;
    bottom: 16px;
  }
}
</style>
