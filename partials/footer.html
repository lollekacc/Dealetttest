  <style>
    footer{
      font-family: "Inter", sans-serif;
    }

    .site-footer__bg{
      position:absolute;
      inset:0;
      pointer-events:none;
      overflow:hidden;
      z-index:0;
    }

    .site-footer__gradient{
      position:absolute;
      inset:0;
      background:
        radial-gradient(circle at 15% 18%, rgba(34,197,94,0.16), transparent 34%),
        radial-gradient(circle at 84% 12%, rgba(14,165,233,0.16), transparent 30%),
        radial-gradient(circle at 50% 120%, rgba(255,255,255,0.06), transparent 42%),
        linear-gradient(180deg, rgba(255,255,255,0.025) 0%, rgba(255,255,255,0) 35%),
        linear-gradient(135deg, #0b0e13 0%, #090b10 45%, #05070b 100%);
    }

    .site-footer__glow{
      position:absolute;
      border-radius:999px;
      filter:blur(100px);
      opacity:1;
    }

    .site-footer__glow--left{
      width:360px;
      height:360px;
      left:-90px;
      top:-70px;
      background:rgba(34,197,94,0.14);
    }

    .site-footer__glow--right{
      width:320px;
      height:320px;
      right:-80px;
      top:10px;
      background:rgba(59,130,246,0.13);
    }

    .site-footer__grid{
      position:absolute;
      inset:0;
      background-image:
        linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
      background-size:48px 48px;
      mask-image:linear-gradient(to bottom, rgba(255,255,255,0.22), transparent 78%);
      -webkit-mask-image:linear-gradient(to bottom, rgba(255,255,255,0.22), transparent 78%);
      opacity:.22;
    }

    .site-footer__noise{
      position:absolute;
      inset:0;
      opacity:.06;
      background-image:
        radial-gradient(rgba(255,255,255,0.65) 0.6px, transparent 0.6px);
      background-size:18px 18px;
      mix-blend-mode:soft-light;
    }

    .site-footer__topline{
      position:absolute;
      top:0;
      left:0;
      width:100%;
      height:1px;
      background:linear-gradient(
        90deg,
        transparent 0%,
        rgba(255,255,255,0.08) 18%,
        rgba(255,255,255,0.42) 50%,
        rgba(255,255,255,0.08) 82%,
        transparent 100%
      );
    }

    .site-footer__link{
      position:relative;
      color:rgba(255,255,255,0.78);
      text-decoration:none;
      transition:color .25s ease, transform .25s ease;
    }

    .site-footer__link:hover{
      color:#ffffff;
      transform:translateY(-1px);
    }

    .site-footer__link::after{
      content:"";
      position:absolute;
      left:0;
      bottom:-6px;
      width:100%;
      height:2px;
      border-radius:999px;
      background:linear-gradient(90deg, rgba(34,197,94,0.9), rgba(59,130,246,0.9));
      transform:scaleX(0);
      transform-origin:center;
      transition:transform .28s ease;
      opacity:.95;
    }

    .site-footer__link:hover::after{
      transform:scaleX(1);
    }

    .site-footer__social{
      display:flex;
      align-items:center;
      justify-content:center;
      width:48px;
      height:48px;
      border-radius:999px;
      border:1px solid rgba(255,255,255,0.10);
      background:rgba(255,255,255,0.04);
      color:rgba(255,255,255,0.70);
      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);
      box-shadow:0 10px 28px rgba(0,0,0,0.26);
      transition:
        transform .28s ease,
        border-color .28s ease,
        background .28s ease,
        color .28s ease,
        box-shadow .28s ease;
    }

    .site-footer__social:hover{
      transform:translateY(-2px);
      border-color:rgba(255,255,255,0.18);
      background:rgba(255,255,255,0.08);
      color:#ffffff;
      box-shadow:0 14px 32px rgba(0,0,0,0.34);
    }

    @media (max-width: 768px){
      .site-footer__link{
        font-size:15px;
      }

      .site-footer__social{
        width:46px;
        height:46px;
      }
    }
  </style>
